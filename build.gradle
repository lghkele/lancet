plugins {
    id 'base'
}

ext {
    lancet_group = 'me.ele'
    lancet_version = '1.0.7'

    kotlin_version = '1.9.24'
    android_tools_version = '8.6.1'
    compile_sdk_version = 34
    target_sdk_version = 34
    min_sdk_version = 24

    asm_version = '9.6'
    guava_version = '33.0.0-jre'
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// GitHub Packages is opt-in so local development and `publishToMavenLocal`
// continue to work without credentials. Enable it with
// `-PpublishToGitHubPackages=true` and provide `GITHUB_REPOSITORY` (for
// example, `owner/repository`) plus `GITHUB_ACTOR`/`GITHUB_TOKEN`.
def publishToGitHubPackages = providers.gradleProperty('publishToGitHubPackages')
        .map { it.toBoolean() }
        .orElse(false)
def githubRepository = providers.gradleProperty('githubRepository')
        .orElse(System.getenv('GITHUB_REPOSITORY') ?: '')
def projectRepository = githubRepository.get() ?: 'lghkele/lancet'
def githubUser = providers.gradleProperty('gpr.user')
        .orElse(System.getenv('GITHUB_ACTOR') ?: '')
def githubToken = providers.gradleProperty('gpr.key')
        .orElse(System.getenv('GITHUB_TOKEN') ?: '')

subprojects { subproject ->
    group = lancet_group
    version = lancet_version

    pluginManager.withPlugin('java') {
        java {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        }
    }

    if (subproject.name != 'sample-test') {
        pluginManager.apply('maven-publish')
        pluginManager.withPlugin('java') {
            java {
                withSourcesJar()
            }
            if (subproject.name != 'lancet-plugin') {
                publishing {
                    publications {
                        mavenJava(MavenPublication) {
                            from components.java
                        }
                    }
                }
            }
        }

        pluginManager.withPlugin('maven-publish') {
            publishing {
                repositories {
                    if (publishToGitHubPackages.get()) {
                        if (!githubRepository.get()) {
                            throw new GradleException(
                                    'githubRepository is required when publishing to GitHub Packages')
                        }
                        maven {
                            name = 'GitHubPackages'
                            url = uri("https://maven.pkg.github.com/${githubRepository.get()}")
                            credentials {
                                username = githubUser.get()
                                password = githubToken.get()
                            }
                        }
                    }
                }

                // Adds useful metadata to the normal Java publications and to
                // the publications generated by java-gradle-plugin.
                publications.withType(MavenPublication).configureEach {
                    pom {
                        name = "Lancet ${project.name}"
                        description = 'A lightweight AOP framework for Android.'
                        url = "https://github.com/${projectRepository}"
                        licenses {
                            license {
                                name = 'The Apache License, Version 2.0'
                                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            }
                        }
                        scm {
                            connection = "scm:git:https://github.com/${projectRepository}.git"
                            developerConnection = "scm:git:ssh://git@github.com/${projectRepository}.git"
                            url = "https://github.com/${projectRepository}"
                        }
                    }
                }
            }
        }
    }
}

tasks.register('uploadAll') {
    group = 'publishing'
    description = 'Publishes all Lancet artifacts to the local Maven repository.'
    dependsOn subprojects
            .findAll { it.name != 'sample-test' }
            .collect { it.tasks.named('publishToMavenLocal') }
}

tasks.register('publishAllToGitHubPackages') {
    group = 'publishing'
    description = 'Publishes all Lancet artifacts to GitHub Packages.'
    doFirst {
        if (!publishToGitHubPackages.get()) {
            throw new GradleException(
                    'Enable GitHub Packages publishing with -PpublishToGitHubPackages=true')
        }
    }
    dependsOn subprojects
            .findAll { it.name != 'sample-test' }
            .collect {
                // The repository-specific publish task only exists when the
                // opt-in GitHub Packages repository is configured.
                it.tasks.matching {
                    task -> task.name == 'publishAllPublicationsToGitHubPackagesRepository'
                }
            }
}
